red:
  inp_path: networks/Net1.inp   # red de ejemplo — cambia esto a tu propia .inp

demanda_base:
  resetear: false
  valor_lps: 2.366   # demanda base de diseño pareja para todos los nodos (antes de cualquier extra)

extra_caudal:
  activo: false
  presupuesto_lps: 10.0   # caudal de diseño extra, repartido proporcional a la demanda base

restricciones:
  velocidad:
    activo: true
    vmin: 0.59
    vmax: 3.0
    peso_penalizacion: 10
    excepciones_vmax:
      "161": 5.0   # línea de aducción al tanque, tolera hasta 5 m/s

  perdida_unitaria:
    activo: true
    hlmax: 60
    peso_penalizacion: 5

  presion_minima:
    activo: false
    valor: 15
    peso_penalizacion: 15

  costo:
    activo: false
    tabla_costos: costos_pvc.csv
    peso_en_objetivo: 1

catalogo_diametros: [50, 60, 63, 75, 100, 125, 150, 175, 200, 225, 250, 300, 325, 350, 375, 400, 450, 500]

ga:
  sembrar_diseno_actual: true   # inyecta el diseño actual (redondeado al catálogo) en la población inicial
  poblacion: 150
  generaciones: 300
  prob_cruce: 0.7
  prob_mutacion: 0.2
  tam_torneo: 3
  semilla: 42
  procesos: 14
  checkpoint_path: checkpoint.pkl
  checkpoint_cada: 5
  reparacion_activa: true   # si una tubería sale de rango, le ajusta un escalón de catálogo en la dirección que corrige y reevalúa, antes de dejarlo solo al cruce/mutación aleatorios
  reparacion_max_intentos: 3   # corregir una tubería puede desviar caudal y sacar de rango a otra — hasta esta cantidad de rondas mientras siga mejorando
  restringir_banda_diametros: true   # acota cada tubería a un rango de catálogo físicamente plausible (estimado por caudal), en vez de dejarle el catálogo completo — reduce el espacio de búsqueda real

  reinicio_diversidad:   # si el mejor fitness no mejora en N generaciones seguidas, reemplaza los peores individuos por otros frescos para escapar de un óptimo local
    activo: true
    paciencia: 15     # generaciones sin mejora antes de reiniciar
    fraccion: 0.15    # proporción de la población que se reemplaza cada vez

  poda_temprana:   # solo aplica a búsqueda AFK (multi-semilla) — corta semillas que van muy por detrás de las anteriores, sin gastarles el resto de generaciones
    activo: true
    en_fraccion: 0.2       # generación de control = esta fracción de "generaciones" arriba
    minimo_historial: 3    # no poda hasta tener al menos esta cantidad de semillas completas de referencia
    tolerancia: 1.5        # poda si el fitness en ese punto es más de 1.5x el promedio histórico ahí

  mutacion_adaptativa:   # tasa de mutación alta al principio (explorar), baja al final (afinar) en vez de fija toda la corrida
    activo: true
    prob_min: 0.05   # tasa en la última generación (arranca en prob_mutacion, interpola en línea recta)
